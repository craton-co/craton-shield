[package]
name = "vs-secure-boot"
description = "Secure boot chain verification with PCR measurement for Craton Shield"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Enable the `SoftwareTpm` type (test / dev only).
software-tpm = []

[dependencies]
vs-types = { path = "../types" }
vs-crypto = { path = "../crypto" }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
vs-crypto = { path = "../crypto", features = ["mock-hsm"] }

[lints]
workspace = true
