[package]
name = "vs-storage"
description = "Persistent storage abstraction for configuration and key material"
edition.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
vs-types = { workspace = true }
vs-crypto = { workspace = true, optional = true }
zeroize = { version = "1", default-features = false }
libc = { version = "0.2", optional = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = []
std = ["libc"]
encrypted = ["vs-crypto"]
capacity-large = []
capacity-xl = []

[dev-dependencies]
vs-crypto = { workspace = true, features = ["mock-hsm"] }

[lints]
workspace = true
