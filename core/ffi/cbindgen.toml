# cbindgen configuration for Craton Shield FFI
#
# Generate header:
#   cbindgen --config core/ffi/cbindgen.toml --crate vs-ffi --output core/include/cratonshield.h

language = "C"
header = """/**
 * Craton Shield — Automotive Cybersecurity Runtime Platform
 *
 * C API for embedded vehicle OS integration.
 * Compliant with ISO/SAE 21434, UN R155, and AUTOSAR.
 *
 * Generated by cbindgen — DO NOT EDIT.
 */"""
include_guard = "CRATONSHIELD_H"
autogen_warning = "/* Warning: this file is autogenously generated by cbindgen. Do not modify this manually. */"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
style = "both"
usize_is_size_t = true

[defines]
"feature = can-fd" = "VS_FEATURE_CAN_FD"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"

[struct]
rename_fields = "None"

[export]
# No explicit include list: cbindgen automatically exports every
# `#[no_mangle] extern "C"` function and any types they reference. As the
# C ABI grows (PQC, degraded-state queries, etc.) keeping a whitelist in
# sync is a maintenance hazard — let cbindgen discover symbols from the
# Rust sources via [parse.expand] below.

[export.rename]

[parse]
parse_deps = false

[parse.expand]
crates = ["vs-ffi"]
