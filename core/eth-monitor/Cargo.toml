[package]
name = "vs-eth-monitor"
description = "Automotive Ethernet intrusion detection with SOME/IP, DoIP, and ARP monitoring"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
vs-types.workspace = true

[dependencies.criterion]
version = "0.5"
default-features = false
features = ["cargo_bench_support"]
optional = true

[features]
default = []
# Enables criterion benches under benches/.
bench = ["dep:criterion"]

[[bench]]
name = "siphash_payload_fused"
harness = false
required-features = ["bench"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
