[package]
name = "vs-crypto"
description = "Cryptographic provider traits and post-quantum abstractions for Craton Shield"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
vs-types = { path = "../types" }
zeroize = { version = "1", default-features = false }
subtle = { version = "2", default-features = false }

# RustCrypto crates — only pulled in with the `software` feature.
# All used with default-features = false for no_std compatibility.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"], optional = true }
ecdsa = { version = "0.16", default-features = false, features = ["signing", "verifying"], optional = true }

# Post-quantum cryptography crates (FIPS 203 / FIPS 204).
ml-kem = { version = "0.2", default-features = false, optional = true }
ml-dsa = { version = "0.1.0-rc.3", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

[features]
default = []
mock-hsm = []
pq-software = []
software = ["dep:aes-gcm", "dep:sha2", "dep:hmac", "dep:hkdf", "dep:p256", "dep:ecdsa"]
pq = ["dep:ml-kem", "dep:ml-dsa", "dep:rand_core"]
pq-cache = ["pq"]

[lints]
workspace = true
