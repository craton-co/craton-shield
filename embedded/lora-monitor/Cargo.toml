[package]
name = "vs-lora-monitor"
publish = false  # uses path deps — remove when ready for crates.io
description = "LoRa / LoRaWAN intrusion detection for Craton Shield"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
vs-types = { path = "../../core/types" }
vs-types-embedded = { path = "../types-embedded" }
aes = { version = "0.8", default-features = false }
cmac = { version = "0.7", default-features = false }

[features]
default = []
capacity-large = ["vs-types-embedded/capacity-large"]
capacity-xl = ["vs-types-embedded/capacity-xl"]

[lints]
workspace = true
