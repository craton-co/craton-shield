[package]
name = "vs-types-embedded"
description = "IoT/embedded type extensions for Craton Shield"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
vs-types.workspace = true
# Genuine constant-time equality primitives. `subtle` is `no_std` by default
# (its `std` feature is opt-in) and provides branchless `ConstantTimeEq`,
# replacing the previous `black_box(diff) == 0` pattern in the `ct_*` helpers.
subtle = { version = "2.6", default-features = false }

[features]
default = []
capacity-large = []
capacity-xl = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
