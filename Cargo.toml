vs-mqtt-monitor = { path = "embedded/mqtt-monitor", version = "0.7.1" }
vs-coap-monitor = { path = "embedded/coap-monitor", version = "0.7.1" }
vs-ble-monitor = { path = "embedded/ble-monitor", version = "0.7.1" }
vs-zigbee-monitor = { path = "embedded/zigbee-monitor", version = "0.7.1" }
vs-lora-monitor = { path = "embedded/lora-monitor", version = "0.7.1" }
