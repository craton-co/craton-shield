vs-report-iec62304 = { path = "core/report-iec62304", version = "0.7.1" }
# Auto crates
vs-types-auto = { path = "auto/types-auto", version = "0.7.1" }
vs-autosar = { path = "auto/autosar", version = "0.7.1" }
vs-v2x = { path = "auto/v2x", version = "0.7.1" }
vs-signal-ids = { path = "auto/signal-ids", version = "0.7.1" }
