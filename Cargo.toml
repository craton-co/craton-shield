[workspace]
resolver = "2"
members = [
    # Core crates (Layer 0-3)
    "core/types",
    "core/health",
    "core/crypto",
    "core/key-manager",
    "core/secure-boot",
    "core/can-monitor",
    "core/eth-monitor",
    "core/ids-engine",
    "core/anomaly",
    "core/integrity",
    "core/netfw",
    "core/ota-validator",
    "core/event-logger",
    "core/policy-engine",
    "core/runtime",
    "core/ffi",
    "core/storage",
    "core/hal",
    "core/hal-linux",
    "core/evidence-envelope",
    "core/report-iec62443",
    "core/report-iso21434",
    "core/report-iec62304",
    # Auto crates
    "auto/types-auto",
    "auto/autosar",
    "auto/v2x",
    "auto/signal-ids",
    "auto/diag-gateway",
    "auto/runtime-auto",
    "auto/ffi-auto",
    # Embedded crates
    "embedded/types-embedded",
    "embedded/mqtt-monitor",
    "embedded/coap-monitor",
    "embedded/ble-monitor",
    "embedded/zigbee-monitor",
    "embedded/lora-monitor",
    "embedded/modbus-monitor-emb",
    "embedded/runtime-embedded",
    # Industrial crates
    "industrial/types-ind",
    "industrial/modbus-monitor-ind",
    "industrial/opcua-monitor",
    "industrial/profinet-monitor",
    "industrial/ethernetip-monitor",
    "industrial/dnp3-monitor",
    "industrial/bacnet-monitor",
    "industrial/runtime-ind",
    "industrial/s7comm-monitor",
    "industrial/iec60870-monitor",
    "industrial/iec61850-monitor",
]

[workspace.package]
edition = "2021"
version = "0.7.1"
authors = ["Craton Shield Contributors"]
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/craton-co/craton-shield"
homepage = "https://github.com/craton-co/craton-shield"
keywords = ["embedded", "cybersecurity", "intrusion-detection", "security", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"

[workspace.dependencies]
# Core crates
vs-types = { path = "core/types", version = "0.7.1" }
vs-health = { path = "core/health", version = "0.7.1" }
vs-crypto = { path = "core/crypto", version = "0.7.1" }
vs-key-manager = { path = "core/key-manager", version = "0.7.1" }
vs-secure-boot = { path = "core/secure-boot", version = "0.7.1" }
vs-can-monitor = { path = "core/can-monitor", version = "0.7.1" }
vs-eth-monitor = { path = "core/eth-monitor", version = "0.7.1" }
vs-ids-engine = { path = "core/ids-engine", version = "0.7.1" }
vs-anomaly = { path = "core/anomaly", version = "0.7.1" }
vs-integrity = { path = "core/integrity", version = "0.7.1" }
vs-netfw = { path = "core/netfw", version = "0.7.1" }
vs-ota-validator = { path = "core/ota-validator", version = "0.7.1" }
vs-event-logger = { path = "core/event-logger", version = "0.7.1" }
vs-policy-engine = { path = "core/policy-engine", version = "0.7.1" }
vs-runtime = { path = "core/runtime", version = "0.7.1" }
vs-ffi = { path = "core/ffi", version = "0.7.1" }
vs-storage = { path = "core/storage", version = "0.7.1" }
vs-hal = { path = "core/hal", version = "0.7.1" }
vs-hal-linux = { path = "core/hal-linux", version = "0.7.1" }
