name: Feature Request
description: Suggest a new feature or improvement for Craton Shield
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? We'd love to hear about it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which domain(s) does this feature affect?
      multiple: true
      options:
        - Core (shared primitives)
        - Automotive (auto/)
        - Embedded IoT (embedded/)
        - Industrial OT/ICS (industrial/)
        - Cross-domain
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Design Constraints
      description: Consider whether this feature is compatible with Craton Shield's design principles.
      options:
        - label: Compatible with `#![no_std]` (no heap allocation)
        - label: No `unsafe` code required (or minimal, well-justified)
        - label: Bounded execution time (no unbounded loops or recursion)
        - label: Fits within existing capacity tiers
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested.
          required: true
