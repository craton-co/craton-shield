#
# cbindgen configuration for vs-ffi-auto C header generation.
# Usage:
#   cbindgen --config auto/ffi-auto/cbindgen.toml \
#            --crate vs-ffi-auto \
#            --output auto/ffi-auto/vs_auto.h

language = "C"

header = """// SPDX-License-Identifier: Apache-2.0
// Copyright 2026 Craton Software Company
//
// C header for vs-ffi-auto. Manually maintained — update when FFI surface changes."""

include_guard = "VS_AUTO_H"
tab_width = 4
style = "both"

after_includes = """
#ifdef __cplusplus
extern "C" {
#endif"""

trailer = """
#ifdef __cplusplus
}
#endif"""

[export]
# No explicit include list: cbindgen automatically exports every
# `#[no_mangle] extern "C"` function and any types they reference,
# including `VsLinFrame`, `VsFlexRayFrame`, `VsUdsRequest`, `VsUdsDecision`,
# and `VsOtaManifest`. Maintaining a whitelist in sync with the Rust
# sources is a maintenance hazard — let cbindgen discover types from the
# exported function signatures. Matches `core/ffi/cbindgen.toml`.

[fn]
rename_args = "CamelCase"
